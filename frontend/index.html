<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让页面铺到刘海与圆角之外，
         CSS 里的 env(safe-area-inset-*) 才有值；
         没有它，浏览器一律把安全区报成 0。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- 原生控件（滚动条、下拉、表单）跟着主题走 -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0b" />
    <title>本地画廊 · Local Gallery</title>
    <script>
      // 主题与工作台模式在首帧之前定下来：这两个属性决定整页配色，
      // 等 React 挂载再写就会闪一下（暗色主题先亮一屏白）。之后的
      // 真相源仍是 React —— 用户改主题、切换模式时立刻生效。
      (function () {
        var r = document.documentElement;
        var systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
        var t = systemDark ? "dark" : "light";
        try {
          var s =
            JSON.parse(localStorage.getItem("local-gallery-ui") || "{}")
              .state || {};
          t =
            s.theme === "dark" || (s.theme !== "light" && systemDark)
              ? "dark"
              : "light";
        } catch (e) {}
        r.setAttribute("data-theme", t);
        r.setAttribute(
          "data-mode",
          /^\/comic(?:\/|$)/.test(location.pathname) ? "comic" : "photo",
        );
      })();
    </script>
  </head>
  <body class="bg-bg text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
