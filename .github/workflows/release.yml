name: Release
run-name: 正式发布 ${{ inputs.version || inputs.increment }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 正式版本递增方式，首个版本固定为 v2.0.0
        type: choice
        options: [patch, minor]
        default: patch
      version:
        description: 可留空自动计算，重试已创建的标签时填写同一版本
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: 确定发布版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 根据已有标签计算版本
        id: version
        shell: bash
        env:
          INCREMENT: ${{ inputs.increment }}
          REQUESTED_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo '请从仓库默认分支发布。' >&2
            exit 1
          fi
          tag=$(node scripts/release-version.mjs "$INCREMENT" "$REQUESTED_VERSION")
          test -s "docs/release-notes/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "发布 $tag（$GITHUB_SHA）" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: 运行发布门禁
    needs: prepare
    uses: ./.github/workflows/ci.yml

  frontend:
    name: 构建前端
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖并构建
        working-directory: frontend
        env:
          LOCAL_GALLERY_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3

  package:
    name: 打包 ${{ matrix.os }}-${{ matrix.arch }}
    needs: [prepare, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-latest}
          - {os: linux, arch: arm64, runner: ubuntu-latest}
          - {os: darwin, arch: amd64, runner: ubuntu-latest}
          - {os: darwin, arch: arm64, runner: ubuntu-latest}
          - {os: windows, arch: amd64, runner: windows-latest}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: 生成发布包
        shell: bash
        run: node scripts/package-release.mjs "$VERSION" "$TARGET_OS" "$TARGET_ARCH" artifacts --skip-frontend
      - name: 解压并验收 Windows 便携包
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/windows-portable/smoke.py "artifacts/local-gallery-v${env:VERSION}-windows-amd64-portable.zip" $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/local-gallery-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: 公开 GitHub Release
    needs: [prepare, verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: 校验产物及生成 SHA256SUMS
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(local-gallery-*)
          test "${#assets[@]}" = 5
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: 上传草稿附件并发布
        shell: bash
        run: |
          set -euo pipefail
          if published=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$published" != true ]]; then
              echo "$RELEASE_TAG 已公开，不能覆盖正式发布的附件。" >&2
              exit 1
            fi
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "发布 $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if [[ "${published:-}" != true ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Local Gallery $RELEASE_TAG" \
              --notes-file "docs/release-notes/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
