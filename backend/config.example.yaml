# ============================================
# 后端配置文件示例（复制为 config.yaml 并按需修改）
# ============================================
#
# 启动顺序：YAML 显式值 > 内置默认值。
# 未列出的字段会使用 Default() 的内置值。
# 缓存目录未配置时自动在进程 CWD 下创建 .comic-reader/。

# 漫画根目录（必填，必须是已存在的目录）
comicRoot: "E:\\漫画"

# 监听地址与端口
host: "0.0.0.0"
port: 8080

# 缩略图缓存目录（相对路径相对 CWD；留空则用 ./.comic-reader）
cacheDir: ".comic-reader"

# 缩略图尺寸（像素）
thumbSizeW: 320
thumbSizeH: 350

# 缓存保留天数；超过此天数的不再被引用时清理
cacheMaxAgeDays: 30

# 是否允许通过 /api/fs/open 在服务端打开系统文件管理器
# （仅在受信环境开启，如本地开发）
allowOsOpen: false

# 前端构建产物目录（用于生产模式单端口托管）
# 留空或目录不存在则跳过静态资源托管
staticDir: "dist"