# ============================================
# 后端配置文件示例（复制为 config.yaml 并按需修改）
# ============================================
#
# 启动顺序：YAML 显式值 > 内置默认值。
# 未列出的字段会使用 Default() 的内置值。
# 缓存目录未配置时自动在进程 CWD 下创建 .local-gallery/。

# 媒体根目录（数组，推荐）
# 支持配置多个目录,所有根下的子目录都会被扫描、合并到一个全局库中。
# 旧配置 `mediaRoot: "..."` / `comicRoot: "..."` 仍然兼容（视为单元素数组）,
# 首次保存后会被规范化成 `mediaRoots` 数组。
# 后端会递归扫描所有子目录,把每个非空目录视为一个"文件夹"。
mediaRoots:
  - "E:\\照片"
  - "F:\\漫画"

# 监听地址与端口
host: "0.0.0.0"
port: 8080

# 缩略图缓存目录（相对路径相对 CWD；留空则用 ./.local-gallery）
cacheDir: ".local-gallery"

# 缩略图尺寸（像素）
thumbSizeW: 320
thumbSizeH: 350

# 缩略图 LRU 内存缓存项数；增大可减少重复生成 / 磁盘读
# 200+ 收藏/历史的库建议 500-1000；过大会占内存（每项约 30-80 KB）
thumbCacheSize: 500

# 缓存保留天数；超过此天数的不再被引用时清理
cacheMaxAgeDays: 30

# 是否允许通过 /api/fs/open 在服务端打开系统文件管理器
# （仅在受信环境开启，如本地开发）
allowOsOpen: false

# 前端构建产物目录（用于生产模式单端口托管）
# 留空或目录不存在则跳过静态资源托管
staticDir: "dist"
